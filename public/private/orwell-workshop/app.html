<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>orwell-tutor</title>
<style>
  :root {
    --bg-deep:    #1c1c1c;
    --bg:         #1e1e1e;
    --bg-soft:    #262626;
    --bg-input:   #0d0d0d;
    --fg:         #e8e8e8;
    --fg-soft:    #c8c8c8;
    --comment:    #6c7086;
    --green:      #4afa57;
    --green-soft: #4afa5722;
    --yellow:     #f1fa8c;
    --orange:     #ffb86c;
    --pink:       #ff79c6;
    --red:        #ff6b6b;
    --blue:       #62b1ff;
    --purple:     #bd93f9;
    --rule:       #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #353535 0%, #2a2a2a 40%, #1f1f1f 100%);
    font-family: "Menlo", "Monaco", "SF Mono", "Courier New", monospace;
    min-height: 100vh;
    padding: 28px 14px 60px;
    color: var(--fg);
  }
  .window {
    max-width: 820px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 9px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.55),
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 0 0 1px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .titlebar {
    background: linear-gradient(to bottom, #3c3c3c, #2c2c2c);
    border-bottom: 1px solid #000;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.4);
  }
  .dot.red    { background: #ff605c; }
  .dot.yellow { background: #ffbd44; }
  .dot.green  { background: #00ca4e; }
  .title {
    flex: 1; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 12px; color: #cccccc; font-weight: 500;
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .body {
    background: var(--bg);
    color: var(--fg);
    padding: 18px 22px 26px;
    font-family: "Menlo", "Monaco", "SF Mono", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.65;
    min-height: 480px;
  }
  .body p { margin: 0.6em 0; }
  .body a { color: var(--blue); }
  .stage-label {
    color: var(--comment);
    font-size: 11px;
    margin-bottom: 10px;
    text-transform: lowercase;
    letter-spacing: 0.02em;
  }
  .stage-label::before { content: "# "; color: #555; }
  .heading {
    color: var(--yellow);
    font-weight: normal;
    margin: 16px 0 8px;
    font-size: 13px;
  }
  .heading::before { content: "## "; color: var(--comment); }
  h2 {
    color: var(--fg);
    font-weight: normal;
    font-size: 14px;
    margin: 6px 0 8px;
  }
  h2::before { content: "# "; color: var(--comment); }
  blockquote {
    margin: 12px 0;
    padding: 9px 14px;
    background: var(--bg-soft);
    border-left: 2px solid var(--orange);
    color: var(--fg);
  }
  blockquote.real    { border-left-color: var(--green); }
  blockquote.original{ border-left-color: var(--purple); }
  blockquote.student { border-left-color: var(--blue); }
  blockquote.epigraph{ border-left-color: var(--comment); background: transparent; padding: 4px 14px; font-style: italic; color: var(--fg-soft); margin: 0 0 14px; }
  blockquote.epigraph .src { color: var(--comment); font-style: normal; }
  blockquote .src {
    display: block; margin-top: 8px;
    font-size: 11px; color: var(--comment);
  }
  .rule-quote {
    color: var(--yellow);
    background: var(--bg-soft);
    border-left: 2px solid var(--yellow);
    padding: 9px 14px;
    margin: 10px 0;
  }
  .rule-quote .num {
    color: var(--green);
    font-weight: bold;
    margin-right: 0.6em;
  }
  /* Click-or-drag phrase flagging */
  .taggable {
    margin: 12px 0;
    padding: 12px 14px;
    background: var(--bg-soft);
    border-left: 2px solid var(--orange);
    line-height: 2.1;
    font-size: 14px;
  }
  .taggable .lead {
    display: block;
    color: var(--comment);
    font-size: 11px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .sentence-container {
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
  }
  .word {
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.08s;
    padding: 1px 0;
  }
  .word:hover { background: rgba(255,184,108,0.18); }
  .word.flagged {
    background: var(--orange);
    color: #1c1c1c;
  }
  .word.flagged:hover { background: #ffa44a; }
  .ws { padding: 1px 0; }
  .ws.flagged { background: var(--orange); }
  ::selection { background: rgba(255,184,108,0.35); }
  .flag-count {
    margin-top: 8px;
    font-size: 11px;
    color: var(--comment);
  }
  textarea, input[type="text"], input[type="password"], select {
    background: var(--bg-input);
    color: var(--fg);
    border: 1px solid var(--rule);
    border-radius: 3px;
    font-family: "Menlo", "Monaco", "SF Mono", "Courier New", monospace;
    font-size: 13px;
    padding: 10px 12px;
    width: 100%;
    line-height: 1.55;
  }
  textarea {
    min-height: 110px;
    resize: vertical;
  }
  textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 1px var(--green);
  }
  ::placeholder { color: #666; }
  button {
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 3px;
    font-family: "Menlo", "Monaco", "SF Mono", "Courier New", monospace;
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
    text-transform: lowercase;
  }
  button:hover { background: var(--green-soft); }
  button:disabled {
    color: #555;
    border-color: #555;
    cursor: not-allowed;
    background: transparent;
  }
  button.secondary {
    color: var(--comment);
    border-color: var(--comment);
  }
  button.secondary:hover { background: rgba(108,113,134,0.15); }
  button.danger {
    color: var(--red);
    border-color: var(--red);
  }
  button.danger:hover { background: rgba(255,107,107,0.12); }
  .actions {
    display: flex; gap: 10px; margin-top: 14px;
    align-items: center; flex-wrap: wrap;
  }
  .actions .spacer { flex: 1; }
  .feedback {
    background: var(--bg-soft);
    border-left: 2px solid var(--blue);
    padding: 12px 16px;
    margin: 12px 0;
    color: var(--fg);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .feedback p { margin: 0.5em 0; }
  .feedback strong { color: var(--yellow); }
  .feedback em { color: var(--orange); font-style: normal; }
  .error {
    color: var(--red);
    border-left: 2px solid var(--red);
    padding: 8px 12px;
    margin: 10px 0;
    background: rgba(255,107,107,0.06);
  }
  .error::before { content: "error: "; color: var(--red); }
  .grade-block {
    text-align: center;
    margin: 16px 0;
    padding: 18px;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 4px;
    position: relative;
  }
  .grade-bar {
    height: 6px;
    background: #111;
    border-radius: 3px;
    margin: 16px 24px 4px;
    overflow: hidden;
  }
  .grade-bar-fill {
    height: 100%;
    transition: width 0.6s cubic-bezier(0.2, 0.7, 0.3, 1.0);
  }
  .grade-num {
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    font-family: "Menlo", "Monaco", "SF Mono", "Courier New", monospace;
    display: inline-block;
  }
  .grade-num.low  { color: var(--red); }
  .grade-num.mid  { color: var(--yellow); }
  .grade-num.high { color: var(--green); }
  .grade-num.celebrate { animation: celebrate 0.9s cubic-bezier(0.34, 1.56, 0.64, 1.0); }
  @keyframes celebrate {
    0%   { transform: scale(0.7); opacity: 0; }
    60%  { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1.0); opacity: 1; }
  }
  .grade-num .star {
    color: var(--yellow);
    font-size: 36px;
    margin: 0 8px;
    vertical-align: 6px;
    display: inline-block;
    animation: spin 1.4s ease-out;
  }
  @keyframes spin {
    0% { transform: rotate(-180deg) scale(0); opacity: 0; }
    60% { transform: rotate(20deg) scale(1.2); opacity: 1; }
    100% { transform: rotate(0deg) scale(1); opacity: 1; }
  }
  .grade-label {
    font-size: 11px;
    color: var(--comment);
    margin-top: 8px;
    text-transform: lowercase;
  }
  .grade-explanation {
    margin-top: 14px;
    text-align: left;
    color: var(--fg);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .reveal-block {
    margin-top: 18px;
    padding: 14px 16px;
    background: rgba(189,147,249,0.06);
    border-left: 2px solid var(--purple);
    border-radius: 3px;
  }
  /* Idea Catalyst — a small brainstorming nudge above the textarea */
  .catalyst-block {
    margin: 10px 0 12px;
    padding: 10px 14px;
    background: rgba(241,250,140,0.05);
    border-left: 2px solid var(--yellow);
    border-radius: 3px;
    color: var(--fg);
    line-height: 1.6;
    font-size: 12.5px;
  }
  .catalyst-block .catalyst-label {
    color: var(--yellow);
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .catalyst-block .catalyst-label::before { content: "## "; color: var(--comment); }
  .catalyst-block p { margin: 0.3em 0; }
  button.catalyst {
    color: var(--yellow);
    border-color: var(--yellow);
  }
  button.catalyst:hover { background: rgba(241,250,140,0.10); }
  .reveal-block .reveal-label {
    color: var(--purple);
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .reveal-block .reveal-label::before { content: "## "; color: var(--comment); }
  .reveal-block blockquote {
    border-left-color: var(--purple);
    margin: 6px 0 8px;
  }
  .choices {
    display: flex; flex-direction: column;
    gap: 8px; margin: 12px 0;
  }
  .choice {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    cursor: pointer;
    background: var(--bg);
    color: var(--fg);
  }
  .choice:hover {
    background: var(--bg-soft);
    border-color: #555;
  }
  .choice.selected {
    border-color: var(--green);
    background: rgba(74,250,87,0.06);
  }
  .choice input { display: none; }
  .choice .marker {
    color: var(--green);
    font-weight: bold;
    min-width: 20px;
  }
  .choice .label-rule { color: var(--yellow); }
  .choice .small { color: var(--comment); font-size: 12px; line-height: 1.4; }
  .loading { color: var(--comment); }
  .statusline {
    background: #0a0a0a;
    border-top: 1px solid #000;
    padding: 4px 12px;
    font-size: 11px;
    color: var(--comment);
    display: flex;
    justify-content: space-between;
    font-family: "Menlo", "Monaco", "SF Mono", monospace;
  }
  .small { font-size: 12px; color: var(--comment); }
  .setup-note {
    background: rgba(241,250,140,0.06);
    border-left: 2px solid var(--yellow);
    padding: 10px 14px;
    margin: 12px 0;
    color: var(--fg-soft);
    font-size: 12.5px;
  }
  .setup-note code {
    color: var(--orange);
    background: var(--bg-input);
    padding: 1px 5px;
    border-radius: 2px;
  }
  /* Boot sequence */
  .boot-screen {
    cursor: pointer;
    min-height: 280px;
    padding: 4px 0;
  }
  .boot-text {
    font-family: "Menlo", "Monaco", "SF Mono", monospace;
    font-size: 13px;
    color: var(--green);
    line-height: 1.7;
    margin: 0;
    white-space: pre-wrap;
  }
  .boot-text .cursor::after {
    content: "▍";
    color: var(--green);
    animation: blink 1s steps(1, end) infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .boot-hint {
    margin-top: 18px;
    color: var(--comment);
    font-size: 11px;
    opacity: 0.7;
  }
  .done-msg { text-align: center; padding: 30px 12px; }
  @media (max-width: 600px) {
    body { font-size: 13px; padding: 12px 8px 30px; }
    .body { padding: 14px 14px 22px; font-size: 12.5px; }
    .grade-num { font-size: 44px; }
    .grade-num .star { font-size: 28px; }
    .taggable { font-size: 13px; line-height: 2.0; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title" id="windowTitle">orwell-tutor</div>
  </div>
  <div class="body" id="root"></div>
  <div class="statusline">
    <span id="statusLeft">orwell-tutor</span>
    <span id="statusRight">[boot]</span>
  </div>
</div>

<script>
"use strict";

// =======================================================================
// HOUSE RULE
// =======================================================================
// NO DOLLAR SIGNS in user-facing strings. This codebase does not use the
// `$ ` shell-prompt aesthetic in any button label, placeholder, stage
// label, status line, boot line, error prefix, or anywhere else a user
// might read it. Template literals (`${...}`) and JS regex back-refs
// (`$1`, `$2`) are fine; literal `$` characters in displayed text are
// not. If you find yourself typing `"$ "` in front of a string, stop.
// =======================================================================

// =======================================================================
// CONFIGURATION
// =======================================================================
const EMBEDDED_API_KEY = "";
const DEFAULT_MODEL = "claude-sonnet-4-5";
const MODEL_OPTIONS = [
  ["claude-sonnet-4-5",         "claude-sonnet-4-5 (recommended)"],
  ["claude-sonnet-4-6",         "claude-sonnet-4-6 (latest)"],
  ["claude-opus-4-6",           "claude-opus-4-6 (highest quality, slower)"],
  ["claude-haiku-4-5-20251001", "claude-haiku-4-5 (fast, cheaper)"]
];

// =======================================================================
// CONTENT
// =======================================================================

const RULES = [
  { num: 1, short: "metaphors",
    quote: "Never use a metaphor, simile or other figure of speech which you are used to seeing in print." },
  { num: 2, short: "long words",
    quote: "Never use a long word where a short one will do." },
  { num: 3, short: "cut every word",
    quote: "If it is possible to cut a word out, always cut it out." },
  { num: 4, short: "active voice",
    quote: "Never use the passive where you can use the active." },
  { num: 5, short: "plain English",
    quote: "Never use a foreign phrase, a scientific word or a jargon word if you can think of an everyday English equivalent." }
];

// Stage 1 corrupted exemplifiers. Each rule has 12 examples drawn from
// Orwell's own best sentences. The corruption strategy is:
// introduce EXACTLY ONE rule violation per sentence, hitting the
// strongest part of Orwell's line — the fresh image, the punchy verb,
// the specific concrete detail — so the student can hear exactly
// where the life went out of it. Never two violations. Never three.
const STAGE1_EXAMPLES = {
  1: [
    {
      corrupted: "The thick blood welled out of him like there was no tomorrow, but still he did not die.",
      sourceOriginal: "The thick blood welled out of him like red velvet, but still he did not die.",
      sourceCitation: "'Shooting an Elephant', 1936",
      offenders: "The fresh image — 'like red velvet' — has been replaced by the dying-metaphor cliché 'like there was no tomorrow.'"
    },
    {
      corrupted: "Near the ceiling long lines of bugs marched all day thick as thieves, and at night came down ravenously hungry.",
      sourceOriginal: "Near the ceiling long lines of bugs marched all day like columns of soldiers, and at night came down ravenously hungry.",
      sourceCitation: "Down and Out in Paris and London, 1933",
      offenders: "Orwell's fresh comparison — 'like columns of soldiers' — has been replaced by the cliché 'thick as thieves.'"
    },
    {
      corrupted: "Hanging from the ceiling there was a heavy glass chandelier that had clearly seen better days.",
      sourceOriginal: "Hanging from the ceiling there was a heavy glass chandelier on which the dust was so thick that it was like fur.",
      sourceCitation: "The Road to Wigan Pier, 1937",
      offenders: "The fresh figure 'so thick that it was like fur' has been replaced by the stale idiom 'seen better days.'"
    },
    {
      corrupted: "On the top shelves near the ceiling the quarto volumes of extinct encyclopedias were gathering dust on their sides.",
      sourceOriginal: "On the top shelves near the ceiling the quarto volumes of extinct encyclopedias slumbered on their sides in piles like the tiered coffins in common graves.",
      sourceCitation: "Keep the Aspidistra Flying, 1936",
      offenders: "The fresh image — books as 'tiered coffins in common graves,' which makes obsolescence and burial the same act — has been replaced by the cliché 'gathering dust.'"
    },
    {
      corrupted: "It struck downwards through the leaves of the limes, and a spray of leaves in the doorway gleamed with a green that was a sight for sore eyes.",
      sourceOriginal: "It struck downwards through the leaves of the limes, and a spray of leaves in the doorway gleamed with a transient, matchless green, greener than jade or emerald or Atlantic waters.",
      sourceCitation: "A Clergyman's Daughter, 1935",
      offenders: "The escalating ladder of greens — jade, emerald, Atlantic waters — has been replaced by the tired phrase 'a sight for sore eyes.'"
    },
    {
      corrupted: "He was one of those people with a chip on his shoulder.",
      sourceOriginal: "He was one of those people who can chew their grievances like a cud.",
      sourceCitation: "The Road to Wigan Pier, 1937",
      offenders: "Orwell's invented figure — resentment as rumination — has been replaced by the most worn idiom in English for the same idea: 'a chip on his shoulder.'"
    },
    {
      corrupted: "He wears a mask, and pretends to be someone he's not.",
      sourceOriginal: "He wears a mask, and his face grows to fit it.",
      sourceCitation: "'Shooting an Elephant', 1936",
      offenders: "The arresting image — the face that grows into the mask — has been replaced by 'pretends to be someone he's not,' a phrase any commencement speaker could deliver in their sleep."
    },
    {
      corrupted: "Up in the zenith, so high that it dazzled one to look at them, a few vultures were biding their time.",
      sourceOriginal: "Up in the zenith, so high that it dazzled one to look at them, a few vultures circled without the quiver of a wing.",
      sourceCitation: "Burmese Days, 1934",
      offenders: "The vivid stillness — 'circled without the quiver of a wing' — has been replaced by the melodrama-novel cliché 'biding their time.'"
    },
    {
      corrupted: "It is simply an affirmation of naked power; contained in it, quite consciously and intentionally, is the iron fist of tyranny.",
      sourceOriginal: "It is simply an affirmation of naked power; contained in it, quite consciously and intentionally, is the vision of a boot crashing down on a face.",
      sourceCitation: "The Lion and the Unicorn, 1941",
      offenders: "The visualisable image — 'a boot crashing down on a face' — has been replaced by the dying metaphor 'the iron fist of tyranny,' which calls up no picture at all."
    },
    {
      corrupted: "The chimney was crooked and therefore perpetually half choked, and the fire, before it would light, demanded a cupful of kerosene at the drop of a hat.",
      sourceOriginal: "The chimney was crooked and therefore perpetually half choked, and the fire, before it would light, expected to be dosed with a cupful of kerosene, like a drunkard's morning nip of gin.",
      sourceCitation: "A Clergyman's Daughter, 1935",
      offenders: "The simile that does the comic work — kerosene as 'a drunkard's morning nip of gin' — has been replaced by the cliché 'at the drop of a hat.'"
    },
    {
      corrupted: "It was a very narrow street — a row of tall houses that had clearly seen better days.",
      sourceOriginal: "It was a very narrow street — a ravine of tall, leprous houses, lurching towards one another in queer attitudes, as though they had all been frozen in the act of collapse.",
      sourceCitation: "Down and Out in Paris and London, 1933",
      offenders: "The houses' specific posture — leprous, lurching, frozen mid-collapse — has been replaced by the dying-metaphor 'seen better days.'"
    },
    {
      corrupted: "Revolution as he sees it is merely a Pandora's box, begotten by tyranny.",
      sourceOriginal: "Revolution as he sees it is merely a monster that is begotten by tyranny and always ends by devouring its own instruments.",
      sourceCitation: "'Charles Dickens', 1940",
      offenders: "The single sustained figure — a monster begotten by tyranny that devours its own instruments — has been swapped for the cliché 'Pandora's box,' which destroys the picture."
    },
    {
      corrupted: "He was dangling with his toes pointed straight downwards, very slowly revolving, as dead as a doornail.",
      sourceOriginal: "He was dangling with his toes pointed straight downwards, very slowly revolving, as dead as a stone.",
      sourceCitation: "'A Hanging', 1931",
      offenders: "The fresh closer — 'as dead as a stone,' which the precision of 'very slowly revolving' has just earned — has been replaced by the most worn idiom in the language: 'as dead as a doornail.'"
    },
    {
      corrupted: "Through the mist that wreathed the hillside St Athelstan's Church loomed dimly, like a sentinel, its single bell tolling funereally boom! boom! boom!",
      sourceOriginal: "Through the mist that wreathed the hillside St Athelstan's Church loomed dimly, like a leaden sphinx, its single bell tolling funereally boom! boom! boom!",
      sourceCitation: "A Clergyman's Daughter, 1935",
      offenders: "The fresh figure 'like a leaden sphinx' — invented for this church and no other — has been replaced by the cliché 'like a sentinel,' which would fit any tower in any novel."
    },
    {
      corrupted: "To the left, just within sight from the door, stood a great elm-tree, leafless now, its multitudinous twigs reaching for the sky like skeletal fingers.",
      sourceOriginal: "To the left, just within sight from the door, stood a great elm-tree, leafless now, its multitudinous twigs making sepia-coloured lace against the sky.",
      sourceCitation: "Keep the Aspidistra Flying, 1936",
      offenders: "The invented image — twigs making 'sepia-coloured lace against the sky' — has been replaced by the standard winter-tree cliché 'reaching for the sky like skeletal fingers.'"
    },
    {
      corrupted: "Imaginative writing is, as it were, the back door to positions that are impregnable from the front.",
      sourceOriginal: "Imaginative writing is as it were a flank-attack upon positions that are impregnable from the front.",
      sourceCitation: "'New Words', 1940",
      offenders: "The military figure — a 'flank-attack,' precise and visualisable — has been replaced by the dying metaphor 'the back door,' which calls up no military picture at all."
    },

ORWELL'S BROADER RULES, beyond the famous five (drawn from "Politics and the English Language"):

ETHICS OF STYLE
- Refuse to use language to defend the indefensible (no euphemism for atrocity).
- Treat insincerity as the great enemy of clear language ("the cuttlefish squirting out ink").
- Resist orthodoxy of any colour — orthodoxy demands lifeless prose.
- Refuse the ready-made phrases that "anaesthetise" the brain.

PROCESS
- Put off using words; think first in pictures and sensations.
- Let the meaning choose the word, not the other way about.
- Don't surrender to words: don't let the existing dialect "do the job for you."
- Ask of every sentence: What am I trying to say? What words will express it? What image or idiom will make it clearer? Is this image fresh enough to have an effect? Could I put it more shortly? Have I said anything that is avoidably ugly?

IMAGERY
- Metaphors should call up a visual picture; if they don't, they aren't doing their work.
- Avoid "dying" metaphors — phrases that have lost the picture but kept the air of figurative speech.
- Don't mix incompatible figures.

DICTION
- Prefer the short, Saxon-rooted word over the long, Latin-rooted one.
- Avoid pretentious diction ("phenomenon," "element," "individual," "objective," "categorical," "promote," "constitute," "exhibit," "exploit," "utilize," "eliminate," "liquidate").
- Avoid foreign phrases ("deus ex machina," "ad hoc," "modus vivendi," "status quo," "Weltanschauung," "ipso facto").
- Avoid the "not un-" formation.
- Avoid -ize/-ise coinages and "non-" coinages.

SYNTAX
- Cut every word that can be cut.
- Active voice over passive.
- Avoid "verbal false limbs" ("make contact with," "give rise to," "have the effect of").
- Avoid nominalisations.
- Avoid phrasal substitutes for prepositions ("with respect to," "by virtue of," "in view of").
- Avoid resounding commonplaces.

META-RULE
- Break any of these rules sooner than say anything outright barbarous.

function pickStage1Example(ruleNum) {

  try {

  } catch (_) { seen = []; }
  let pool = all.map((_, i) => i).filter(i => !seen.includes(i));
  if (pool.length === 0) {

async function callClaude(systemPrompt, userMessage, maxTokens = 1500) {

    body: JSON.stringify({
      system: systemPrompt,
      user: userMessage,
      max_tokens: maxTokens
    })
  });
  if (!res.ok) {
    let text = "";
    try { text = await res.text(); } catch (_) {}
    if (res.status === 401) {
      throw new Error("Session expired. Reload the page and sign in again.");
    }
    throw new Error(`server error ${res.status}: ${text || res.statusText}`);
  }
  const data = await res.json();
  return (data.text || "").trim();
}

function parseWorkshopResponse(raw) {
  if (!raw) return { summary: "", suggestions: [], error: "empty response" };
  let txt = raw.trim();
  // strip ```json fences if the model added them despite instructions
  txt = txt.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
  // grab the first {...} block in case of stray prose
  const first = txt.indexOf("{");
  const last = txt.lastIndexOf("}");
  if (first !== -1 && last !== -1) txt = txt.slice(first, last + 1);
  try {
    const obj = JSON.parse(txt);
    const suggestions = Array.isArray(obj.suggestions) ? obj.suggestions
      .filter(s => s && typeof s.phrase === "string" && typeof s.suggested === "string")
      .map(s => ({
        rule_num: Number(s.rule_num) || 0,
        phrase: String(s.phrase),
        why: String(s.why || ""),
        suggested: String(s.suggested)
      })) : [];
    return { summary: String(obj.summary || ""), suggestions, error: "" };
  } catch (e) {
    return { summary: "", suggestions: [], error: "could not parse model response as JSON" };
  }
}

function splitIntoParagraphs(text) {
  return text.split(/\n\s*\n+/).map(p => p.trim()).filter(p => p.length > 0);
}

// Build the "clean version" by applying accepted edits to the original
// paragraph in order. Edits are simple verbatim phrase replacements.
function applyDecisions(paragraph, suggestions, decisions) {
  let out = paragraph;
  for (let i = 0; i < suggestions.length; i++) {
    const d = decisions[i];
    if (!d || !d.accepted) continue;
    const replacement = (d.edited != null ? d.edited : suggestions[i].suggested);
    const phrase = suggestions[i].phrase;
    const idx = out.indexOf(phrase);
    if (idx === -1) continue; // phrase already gone (overlapping edit); skip
    out = out.slice(0, idx) + replacement + out.slice(idx + phrase.length);
  }
  return out;
}

// =======================================================================
// The catalyst's job is to push a student in the direction of writing
// like Orwell — concrete, plain, fresh — by surfacing ONE creative
// move from the writerly tradition Orwell sits inside. The 30
// heuristics below are drawn from five style guides (Zinsser's On
// Writing Well, Pinker's The Sense of Style, McPhee's Draft No. 4,
// Strunk's The Elements of Style, Thomas & Turner's Clear and Simple
// as the Truth) and Orwell's own rubric. The catalyst model picks one
// or two that bear most directly on the student's case and writes a
// single short brainstorming prompt around them, never citing the
// source by name.

const WRITING_HEURISTICS = `Heuristics drawn from seven style guides — Zinsser's "On Writing Well," Pinker's "The Sense of Style," McPhee's "Draft No. 4," Strunk's "The Elements of Style" (3rd ed.), Thomas & Turner's "Clear and Simple as the Truth," Williams's "Style: Lessons in Clarity and Grace," and Rundus's reader's guide to Joseph Mitchell — plus Orwell's own rubric.

ZINSSER:
1. Strip every sentence to its cleanest components. Every word that serves no function is a weed; pull it out — long words that could be short ones, adverbs that mean what the verb already means, passives that hide who is doing what.
2. Write with your own voice. Don't borrow somebody else's register because it sounds more authoritative — your sentences will go dead.
3. Write in the first person where the subject permits. Confidence is contagious; it gives the reader something to grip.
4. Use the active voice. Force the doer onto the page so the reader can see who is doing what to whom.
5. Prefer short, plain, Anglo-Saxon-rooted words. The Latinate one is almost never the better one when both are available.
6. Cut adverbs that merely intensify. The right verb does what "very" or "really" or "extremely" was trying to do.
7. Don't admire your own draft. Read it as a stranger would, and cross out anything that wouldn't survive that reading.

PINKER:
8. Show before you tell. Recruit an image — something the reader can see, hear, smell, touch — before you reach for an abstraction.
9. Treat your prose as a window onto the world. The reader is supposed to see what's outside; you are supposed to keep the glass clean.
10. The "curse of knowledge" is your chief enemy. Assume the reader cannot see what is in your head, and write so they could.
11. Use coherence connectives — "because," "but," "so," "even though" — to name the logical relation between sentences. Don't make the reader guess.
12. Long sentences earn their length only when their parts cohere. If a sentence sprawls, ask whether it has one structure or three colliding ones.

MCPHEE:
13. Structure is the underwater part of the iceberg. Find the shape of the piece before you start filling it with words.
14. A draft is what you delete. Write more than you'll keep; then cut, and cut again. Omission — the Theory of Omission — is the writer's secret weapon.
15. The lede announces the whole piece in miniature. If your first sentence doesn't hint at the argument, the reader is already wandering.
16. Find the one detail that does the work of ten — a specific named object, a precise gesture — and let it carry the paragraph.
17. Trust the verbs. Adjectives pile up as a hedge against weak verbs; find the verb that doesn't need hedging.
18. The thesaurus exists to remind you of the word you already know but have momentarily forgotten — not to find a word you didn't know.

STRUNK:
19. Omit needless words. A sentence should contain no unnecessary words, a paragraph no unnecessary sentences. Vigorous writing is concise.
20. Use definite, specific, concrete language. Particulars beat generalities every time; the great writers — Homer, Dante, Shakespeare — work in particulars.
21. Place the emphatic word at the end of the sentence. The end is the position of stress.
22. Use the active voice; the active voice gives a sentence directness and energy. The passive voice flattens.
23. Don't overstate. A single overstatement bleeds credibility from every claim around it.
24. Keep parallel ideas in parallel form. The reader's ear expects parallelism and notices when it is broken.

THOMAS & TURNER:
25. Adopt the classic stand: the writer has seen something and turns to show it to a competent reader. Drop the apologetic crouch — it undoes the writing.
26. Treat your subject as something the reader can see. Stand beside the reader and point.
27. Plain prose stands inside the scene. Jargon stands outside the scene, gesturing at it from a safe distance — choose to be inside.
28. Define your relation to the reader before you start. Are you a guide, a witness, a colleague? The relation determines the diction.
29. Don't treat thought and expression as separable. Clear writing is clear thinking made visible; muddy writing is a confession.

WILLIAMS:
31. Make subjects the main characters of the action; make verbs name what they do. When subjects aren't characters and verbs aren't actions, the sentence goes cloudy.
32. Begin a sentence with familiar information; end with new information. The reader needs that bridge from old to new built into the syntax.
33. Cluster related ideas together. Don't ask the reader to assemble the relationship from scattered parts of the sentence.

MITCHELL (via Rundus):
34. Listen before you write. The exact word a person used — the cadence, the hesitation, the digression — is almost always sharper than your paraphrase.
35. Build a portrait from physical particulars: what they wore, what they ate, what they did with their hands. The character emerges from the inventory, not from your characterisation.
36. Stand close enough to hear the language, but far enough back to see the subject whole. Both distances earn their place in the prose.

ORWELL'S BACKSTOP:
37. Ask of every sentence: What am I trying to say? What words will express it? What image or idiom will make it clearer? Is this image fresh enough to have an effect? Could I put it more shortly? Have I said anything that is avoidably ugly?`;

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") {
        e.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === "value") e.value = v;
      else if (k === "checked") { if (v) e.checked = true; }
      else if (k === "disabled") { if (v) e.setAttribute("disabled", ""); }
      else if (k === "selected") { if (v) e.selected = true; }
      else e.setAttribute(k, v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatFeedback(text) {
  if (!text) return "";
  let safe = escapeHtml(text);
  safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/(^|\s)_([^_]+)_/g, "$1<em>$2</em>");
  safe = safe.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>");
  return "<p>" + safe + "</p>";
}

function parseGrade(text) {
  if (!text) return null;
  const m = text.match(/GRADE\s*:\s*(\d{1,3})\s*%?/i);
  if (m) return Math.min(100, Math.max(0, parseInt(m[1], 10)));
  const m2 = text.match(/(\d{1,3})\s*%/);
  if (m2) return Math.min(100, Math.max(0, parseInt(m2[1], 10)));
  return null;
}

function stripGradeLine(text) {
  if (!text) return "";
  return text.replace(/^[^\n]*GRADE\s*:\s*\d{1,3}\s*%?[^\n]*\n+/i, "").trim();
}

// Split a Claude grade response into the main explanation and the
// optional COMPARISON: paragraph.
function splitGradeResponse(raw) {
  if (!raw) return { main: "", myRewrite: "", comparison: "" };
  const stripped = stripGradeLine(raw);

  // Find MY REWRITE: and COMPARISON: anchors. Either, both, or neither
  // may be present.
  const myRewriteIdx = stripped.search(/(?:^|\n)\s*(?:#+\s*|\*+\s*)?MY\s*REWRITE\s*:?\s*/i);
  const comparisonIdx = stripped.search(/(?:^|\n)\s*(?:#+\s*|\*+\s*)?COMPARISON\s*:?\s*/i);

  // The main explanation runs from the start to whichever anchor comes first.
  let mainEnd = stripped.length;
  if (myRewriteIdx >= 0 && (comparisonIdx < 0 || myRewriteIdx < comparisonIdx)) {
    mainEnd = myRewriteIdx;
  } else if (comparisonIdx >= 0) {
    mainEnd = comparisonIdx;
  }
  const main = stripped.slice(0, mainEnd).trim();

  let myRewrite = "";
  let comparison = "";
  if (myRewriteIdx >= 0) {
    const rewriteEnd = (comparisonIdx > myRewriteIdx) ? comparisonIdx : stripped.length;
    myRewrite = stripped.slice(myRewriteIdx, rewriteEnd)
      .replace(/^\s*(?:#+\s*|\*+\s*)?MY\s*REWRITE\s*:?\s*\n?/i, "")
      .replace(/^["']|["']$/g, "")
      .trim();
  }
  if (comparisonIdx >= 0) {
    const compEnd = (myRewriteIdx > comparisonIdx) ? myRewriteIdx : stripped.length;
    comparison = stripped.slice(comparisonIdx, compEnd)
      .replace(/^\s*(?:#+\s*|\*+\s*)?COMPARISON\s*:?\s*\n?/i, "")
      .trim();
  }
  return { main, myRewrite, comparison };
}

function gradeColorClass(num) {
  if (num == null) return "mid";
  if (num < 70) return "low";
  if (num < 85) return "mid";
  return "high";
}

function gradeBarColor(num) {
  if (num == null) return "#666";
  if (num < 70) return "var(--red)";
  if (num < 85) return "var(--yellow)";
  return "var(--green)";
}

function tokenize(sentence) {
  return sentence.split(/(\s+)/);
}

// Phrase flagging
function addPhrase(phrases, newPhrase) {
  const overlapping = [];
  for (const p of phrases) {
    if (newPhrase.start <= p.end && newPhrase.end >= p.start) overlapping.push(p);
  }
  if (overlapping.length === 0) {
    phrases.push(newPhrase);
    return;
  }
  let mergedStart = newPhrase.start, mergedEnd = newPhrase.end;
  for (const p of overlapping) {
    mergedStart = Math.min(mergedStart, p.start);
    mergedEnd = Math.max(mergedEnd, p.end);
    const idx = phrases.indexOf(p);
    if (idx >= 0) phrases.splice(idx, 1);
  }
  phrases.push({ start: mergedStart, end: mergedEnd });
}

function findPhraseIdx(phrases, wordIdx) {
  for (let i = 0; i < phrases.length; i++) {
    if (wordIdx >= phrases[i].start && wordIdx <= phrases[i].end) return i;
  }
  return -1;
}

// Read the current text selection. If it overlaps any .word spans inside
// `sc`, fire onUpdate to add the corresponding phrase, clear the
// selection, and return true. Returns false if there is no usable
// selection in `sc`.
//
// Used in three places:
//   1. The mouseup listener on the sentence-container itself.
//   2. A document-level mouseup listener that catches drags whose mouseup
//      lands outside the container (a common UX failure mode — e.g. the
//      user releases the mouse below the box).
//   3. A safety net inside the "submit diagnosis" button: if the user
//      somehow still has an active selection that hasn't been processed,
//      pick it up before complaining about an empty flag list.
function extractSelectionPhrase(sc, onUpdate) {
  if (!sc) return false;
  let included = [];
  try {
    const sel = window.getSelection && window.getSelection();
    if (!sel || sel.rangeCount === 0) return false;
    const range = sel.getRangeAt(0);
    if (!range || range.collapsed) return false;
    sc.querySelectorAll(".word").forEach(span => {
      try {
        if (range.intersectsNode && range.intersectsNode(span)) {
          included.push(parseInt(span.getAttribute("data-i"), 10));
        }
      } catch (_) {}
    });
  } catch (_) { return false; }
  if (included.length === 0) return false;
  onUpdate({
    action: "add",
    phrase: { start: Math.min(...included), end: Math.max(...included) }
  });
  try { window.getSelection().removeAllRanges(); } catch (_) {}
  return true;
}

// One global mouseup catcher. Registered exactly once, at module load.
// Catches drags that mouseup outside the sentence-container (which is the
// most common reason the in-container handler misses a selection).
function installGlobalSelectionCatcher() {
  if (window.__orwellSelectionCatcherInstalled) return;
  window.__orwellSelectionCatcherInstalled = true;
  document.addEventListener("mouseup", () => {
    // Only act in the diagnose step — otherwise selections elsewhere on
    // the page (the rewrite textarea, etc.) shouldn't be turned into
    // flags.
    if (state.view !== "stage1" || state.s1Step !== "diagnose") return;
    const sc = document.getElementById("sentenceContainer");
    if (!sc) return;
    const ruleNum = RULES[state.s1RuleIdx].num;
    const phrasesKey = state.s1Cycle === "made_up" ? "s1MadeUpPhrases" : "s1OrwellPhrases";
    const phrases = state[phrasesKey][ruleNum];
    if (!phrases) return;
    const added = extractSelectionPhrase(sc, (action) => {
      if (action.action === "add") addPhrase(phrases, action.phrase);
    });
    if (added) render();
  });
}

function renderTaggable(sentence, phrases, onUpdate) {
  const wrapper = el("div", { class: "taggable" },
    el("span", { class: "lead" },
      "Drag across a phrase to flag it. Click a single word to flag just that word. Click anywhere in a flagged phrase to remove it."
    )
  );
  const tokens = tokenize(sentence);
  let wordIdx = 0;
  const tokenInfo = tokens.map((tok, ti) => {
    if (/^\s+$/.test(tok)) return { type: "ws", text: tok, ti };
    return { type: "word", text: tok, wordIdx: wordIdx++, ti };
  });
  const wordToPhrase = new Map();
  phrases.forEach((p, pi) => {
    for (let i = p.start; i <= p.end; i++) wordToPhrase.set(i, pi);
  });

  const sc = el("div", { class: "sentence-container", id: "sentenceContainer" });
  tokenInfo.forEach((info, idx) => {
    if (info.type === "word") {
      const flagged = wordToPhrase.has(info.wordIdx);
      sc.appendChild(el("span", {
        class: "word" + (flagged ? " flagged" : ""),
        "data-i": String(info.wordIdx)
      }, info.text));
    } else {
      let prevWord = null;
      for (let k = idx - 1; k >= 0; k--) if (tokenInfo[k].type === "word") { prevWord = tokenInfo[k]; break; }
      let nextWord = null;
      for (let k = idx + 1; k < tokenInfo.length; k++) if (tokenInfo[k].type === "word") { nextWord = tokenInfo[k]; break; }
      let flagged = false;
      if (prevWord && nextWord) {
        const a = wordToPhrase.get(prevWord.wordIdx);
        const b = wordToPhrase.get(nextWord.wordIdx);
        flagged = a !== undefined && a === b;
      }
      sc.appendChild(el("span", { class: "ws" + (flagged ? " flagged" : "") }, info.text));
    }
  });

  sc.addEventListener("mouseup", (e) => {
    // Try to process a text-selection drag first.
    if (extractSelectionPhrase(sc, onUpdate)) return;
    // Otherwise: click-on-word toggles a single-word flag.
    let target = e.target;
    while (target && target !== sc && !(target.classList && target.classList.contains("word"))) target = target.parentNode;
    if (!target || !target.classList || !target.classList.contains("word")) return;
    const wi = parseInt(target.getAttribute("data-i"), 10);
    if (isNaN(wi)) return;
    const pi = findPhraseIdx(phrases, wi);
    if (pi >= 0) onUpdate({ action: "remove", index: pi });
    else onUpdate({ action: "add", phrase: { start: wi, end: wi } });
  });

  let touchStartIdx = null;
  sc.addEventListener("touchstart", (e) => {
    let target = e.target;
    while (target && !(target.classList && target.classList.contains("word"))) target = target.parentNode;
    touchStartIdx = (target && target.classList && target.classList.contains("word"))
      ? parseInt(target.getAttribute("data-i"), 10) : null;
  }, { passive: true });
  sc.addEventListener("touchend", (e) => {
    if (touchStartIdx == null) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    let endTarget = document.elementFromPoint(t.clientX, t.clientY);
    while (endTarget && !(endTarget.classList && endTarget.classList.contains("word"))) endTarget = endTarget.parentNode;
    if (!endTarget) { touchStartIdx = null; return; }
    const endIdx = parseInt(endTarget.getAttribute("data-i"), 10);
    if (isNaN(endIdx)) { touchStartIdx = null; return; }
    if (endIdx === touchStartIdx) {
      const pi = findPhraseIdx(phrases, endIdx);
      if (pi >= 0) onUpdate({ action: "remove", index: pi });
      else onUpdate({ action: "add", phrase: { start: endIdx, end: endIdx } });
    } else {
      onUpdate({ action: "add", phrase: { start: Math.min(touchStartIdx, endIdx), end: Math.max(touchStartIdx, endIdx) } });
    }
    touchStartIdx = null;
  });

  wrapper.appendChild(sc);
  const count = phrases.length;
  wrapper.appendChild(el("div", { class: "flag-count" },
    count === 0 ? "no phrases flagged yet"
                : `${count} phrase${count === 1 ? "" : "s"} flagged`));
  return wrapper;
}

function bracketed(sentence, phrases) {
  if (!phrases || phrases.length === 0) return sentence;
  const sorted = [...phrases].sort((a, b) => a.start - b.start);
  const tokens = tokenize(sentence);
  let wordIdx = 0, phraseI = 0, inPhrase = false, result = "";
  for (const tok of tokens) {
    if (/^\s+$/.test(tok)) { result += tok; }
    else {
      const wi = wordIdx++;
      if (!inPhrase && phraseI < sorted.length && wi === sorted[phraseI].start) {
        result += "[["; inPhrase = true;
      }
      result += tok;
      if (inPhrase && wi === sorted[phraseI].end) {
        result += "]]"; inPhrase = false; phraseI++;
      }
    }
  }
  return result;
}

    exObj = state.s1OrwellPicks[ruleNum];

    expertNote = exObj.offenders;
    sourceCit = exObj.source;
    sourceOriginal = null;
  }

  const phrasesKey = cycle === "made_up" ? "s1MadeUpPhrases" : "s1OrwellPhrases";

                );

                state.error = ""; startLoading(); render();
                try {

              },
              disabled: state.loading
            }, state.loading ? state.loadingMessage + "…" : "submit diagnosis")
          : el("button", { onclick: () => { state.s1Step = "rewrite"; render(); } },
              "continue to rewrite"),
        step === "diagnose_fb"
          ? el("button", { class: "secondary",
              onclick: () => { delete state[fbKey][ruleNum]; state.s1Step = "diagnose"; render(); }
            }, "revise flagging")
          : (step === "diagnose" && phrases.length > 0
              ? el("button", { class: "secondary",
                  onclick: () => { state[phrasesKey][ruleNum] = []; render(); }
                }, "clear all flags")
              : null)
      )
    );
  }

  if (step === "rewrite" || step === "grade") {
    const rewriteText = state[reKey][ruleNum] || "";
    const gradeNum = state[numKey][ruleNum];
    const gradeRaw = state[grKey][ruleNum] || "";
    const catKey = cycle === "made_up" ? "s1MadeUpCatalyst" : "s1OrwellCatalyst";
    const catalystText = state[catKey][ruleNum] || "";

    const advance = () => {
      // Reset the catalyst as we move on; catalysts are tied to the
      // particular sentence the student is rewriting.
      delete state[catKey][ruleNum];
      if (cycle === "made_up") { state.s1Cycle = "orwell"; state.s1Step = "intro"; }
      else if (state.s1RuleIdx < 4) { state.s1RuleIdx += 1; state.s1Cycle = "made_up"; state.s1Step = "intro"; }
      else { state.view = "stage2"; state.s2Round = 0; state.s2Phase = "intro"; }
      render();
    };

    let advanceLabel;
    if (cycle === "made_up") advanceLabel = "continue to part 2 · orwell";
    else if (state.s1RuleIdx < 4) advanceLabel = `continue to rule ${state.s1RuleIdx + 2}`;
    else advanceLabel = "continue to stage 2";

    let gradeUI = null;
    if (step === "grade") {
      if (cycle === "made_up" && sourceOriginal) {
        const split = splitGradeResponse(gradeRaw);
        gradeUI = el("div", null,
          gradeBlock(gradeNum, split.main),
          el("div", { class: "reveal-block" },
            el("div", { class: "reveal-label" }, "Reveal · the original Orwell sentence"),
            el("blockquote", { class: "original" },
              `"${sourceOriginal}"`,
              el("span", { class: "src" }, exObj.sourceCitation || "")
            ),
            split.comparison
              ? el("div", null,
                  el("div", { class: "reveal-label" }, "Compared with your rewrite"),
                  el("div", { class: "feedback", html: formatFeedback(split.comparison) }))
              : null
          )
        );
      } else {
        // Orwell-cycle grade — Claude has produced its own rewrite plus
        // a brief compare/contrast against the student's. Show them.
        const split = splitGradeResponse(gradeRaw);
        gradeUI = el("div", null,
          gradeBlock(gradeNum, split.main),
          (split.myRewrite || split.comparison)
            ? el("div", { class: "reveal-block" },
                split.myRewrite
                  ? el("div", null,
                      el("div", { class: "reveal-label" }, "My rewrite"),
                      el("blockquote", { class: "original" }, `"${split.myRewrite}"`))
                  : null,
                split.comparison
                  ? el("div", null,
                      el("div", { class: "reveal-label" }, "Compared with yours"),
                      el("div", { class: "feedback", html: formatFeedback(split.comparison) }))
                  : null
              )
            : null
        );
      }
    }

    const catalystBtn = step === "rewrite"
      ? catalystButton({
          buildPrompt: () => cycle === "made_up"
            ? catalystStage1CorruptedPrompt({ rule, sentence, sourceOriginal })
            : catalystStage1OrwellPrompt({ rule, sentence, gradeNote: exObj.gradeNote }),
          getStored: () => state[catKey][ruleNum],
          setStored: (t) => { state[catKey][ruleNum] = t; }
        })
      : null;

    return el("div", null,
      headerBlock,
      el("div", { class: "heading" },
        cycle === "made_up" ? "Sentence" : "Sentence (Orwell)"),
      plainSentence(),
      el("div", { class: "heading" }, "Your rewrite"),
      el("p", null, `Rewrite the sentence so it obeys Rule ${rule.num}. Keep the meaning intact.`),
      step === "rewrite" ? renderCatalyst(catalystText) : null,
      el("textarea", {
        id: "s1Rewrite_" + ruleNum + "_" + cycle,
        placeholder: "your rewrite…",
        value: rewriteText,
        oninput: (e) => { state[reKey][ruleNum] = e.target.value; }
      }),
      gradeUI,
      showError(),
      el("div", { class: "actions" },
        step === "rewrite"
          ? el("button", {
              onclick: async () => {
                const rew = state[reKey][ruleNum] || "";
                if (!rew.trim()) { state.error = "please type your rewrite first."; render(); return; }
                state.error = ""; startLoading(); render();
                try {
                  const raw = await callClaude(TUTOR_SYSTEM, gradePrompt({
                    rule, sentence,
                    studentRewrite: rew,
                    isReal: cycle === "orwell",
                    sourceOriginal,
                    sourceCitation: exObj.sourceCitation,
                    gradeNote: cycle === "orwell" ? exObj.gradeNote : undefined
                  }), 700);
                  state[grKey][ruleNum] = raw;
                  state[numKey][ruleNum] = parseGrade(raw);
                  state.s1Step = "grade";
                } catch (err) { state.error = err.message; }
                stopLoading(); render();
              },
              disabled: state.loading
            }, state.loading ? state.loadingMessage + "…" : "submit for grading")
          : el("button", { onclick: advance }, advanceLabel),
        catalystBtn,
        step === "grade"
          ? el("button", { class: "secondary",
              onclick: () => {
                delete state[grKey][ruleNum]; delete state[numKey][ruleNum];
                state.s1Step = "rewrite"; render();
              }
            }, "try a different rewrite")
          : null
      )
    );
  }

  return null;
}

  if (phase === "rewrite" || phase === "compare") {

    return el("div", null,

      phase === "rewrite" ? renderCatalyst(state.s2Catalyst) : null,
      el("textarea", {
        id: "s2Rewrite",
        placeholder: "your rewrite…",

        oninput: (e) => { state.s2Rewrite = e.target.value; }
      }),
      showError(),
      phase === "compare"
        ? el("div", null,
            el("div", { class: "heading" }, "Orwell's original"),
            el("blockquote", { class: "real" },

          )

                state.error = ""; startLoading(); render();

                  }), 500);

                  state.s2Phase = "compare";
                } catch (err) { state.error = err.message; }
                stopLoading(); render();
              },

            }, state.loading ? state.loadingMessage + "…" : "compare with orwell")
          : el("button", {
              onclick: () => {
                if (state.s2Round < 4) {
                  state.s2Round += 1; state.s2Phase = "intro"; state.s2Selection = null;
                  state.s2IdentifyFeedback = ""; state.s2Rewrite = ""; state.s2CompareFeedback = "";
                  state.s2Catalyst = "";

async function loadWorkshopParagraph(i) {
  const para = state.wsParagraphs[i];
  if (!para || para.loaded) return;
  startLoading(); render();
  try {
    const raw = await callClaude(TUTOR_SYSTEM, workshopPrompt(para.text), 1400);
    const parsed = parseWorkshopResponse(raw);
    para.summary = parsed.summary;
    para.suggestions = parsed.suggestions;
    para.decisions = {};
    para.loaded = true;
    para.error = parsed.error;
  } catch (err) {
    para.error = err.message;
  }
  stopLoading(); render();
}

function workshopView() {
  const headerBlock = el("div", null,
    el("div", { class: "stage-label" }, "workshop · paragraph by paragraph"),
    el("h2", null, "Orwell Workshop")
  );

  if (state.wsPhase === "intro") {
    return el("div", null,
      headerBlock,
      el("p", null, "Paste any prose — an essay, a chapter, an email — and I'll walk through it paragraph by paragraph, applying Orwell's five rules. For each paragraph you'll see concrete suggested edits you can accept, edit, or skip. At the end you get a clean version assembled from your decisions."),
      el("textarea", {
        id: "wsRaw",
        placeholder: "paste your text (separate paragraphs with a blank line)…",
        style: "min-height: 220px;",
        value: state.wsRaw,
        oninput: (e) => { state.wsRaw = e.target.value; }
      }),
      showError(),
      el("div", { class: "actions" },
        el("button", {
          onclick: async () => {
            const paras = splitIntoParagraphs(state.wsRaw);
            if (paras.length === 0) {
              state.error = "paste some text first."; render(); return;
            }
            state.error = "";
            state.wsParagraphs = paras.map(t => ({
              text: t, summary: "", suggestions: [],
              decisions: {}, loaded: false, error: ""
            }));
            state.wsIdx = 0;
            state.wsPhase = "working";
            render();
            await loadWorkshopParagraph(0);
          },
          disabled: state.loading
        }, state.loading ? state.loadingMessage + "…" : "begin workshop")
      )
    );
  }

  if (state.wsPhase === "working") {
    const i = state.wsIdx;
    const para = state.wsParagraphs[i];
    const total = state.wsParagraphs.length;
    const progress = el("div", { class: "stage-label" },
      `paragraph ${i + 1} of ${total}`);

    if (!para.loaded && state.loading) {
      return el("div", null, headerBlock, progress,
        el("blockquote", null, `"${para.text}"`),
        el("p", { class: "small" }, state.loadingMessage + "…"));
    }

    if (para.error) {
      return el("div", null, headerBlock, progress,
        el("blockquote", null, `"${para.text}"`),
        el("p", { class: "small" }, "error: " + para.error),
        el("div", { class: "actions" },
          el("button", { onclick: async () => {
            para.error = ""; para.loaded = false;
            await loadWorkshopParagraph(i);
          }}, "retry")));
    }

    const cards = para.suggestions.map((s, idx) => {
      const d = para.decisions[idx] || { accepted: false, skipped: false, edited: null };
      const ruleQuote = (RULES.find(r => r.num === s.rule_num) || {}).quote || "";
      const editingValue = d.edited != null ? d.edited : s.suggested;
      return el("div", {
        class: "choice",
        style: d.skipped ? "opacity: 0.5;" : null
      },
        el("div", { class: "label-rule" },
          `Rule ${s.rule_num}${ruleQuote ? " — " + ruleQuote : ""}`),
        el("p", null,
          el("strong", null, "flagged: "),
          el("em", null, `"${s.phrase}"`)),
        s.why ? el("p", { class: "small" }, s.why) : null,
        el("p", null, el("strong", null, "suggested: ")),
        el("textarea", {
          style: "min-height: 60px;",
          value: editingValue,
          oninput: (e) => {
            para.decisions[idx] = {
              accepted: d.accepted,
              edited: e.target.value === s.suggested ? null : e.target.value
            };
          }
        }),
        el("div", { class: "actions" },
          el("button", {
            class: d.accepted ? "" : "secondary",
            onclick: () => {
              const cur = para.decisions[idx] || { accepted: false, skipped: false, edited: null };
              para.decisions[idx] = { accepted: true, skipped: false, edited: cur.edited };
              render();
            }
          }, d.accepted ? "✓ accepted" : "accept"),
          el("button", {
            class: d.skipped ? "danger" : "secondary",
            onclick: () => {
              const cur = para.decisions[idx] || { accepted: false, skipped: false, edited: null };
              para.decisions[idx] = { accepted: false, skipped: true, edited: cur.edited };
              render();
            }
          }, d.skipped ? "✗ skipped" : "skip")
        )
      );
    });

    const preview = applyDecisions(para.text, para.suggestions, para.decisions);
    const noChanges = preview === para.text;

    return el("div", null,
      headerBlock,
      progress,
      el("div", { class: "heading" }, "Original paragraph"),
      el("blockquote", { class: "original" }, `"${para.text}"`),
      para.summary ? el("p", { class: "small" }, para.summary) : null,
      para.suggestions.length === 0
        ? el("p", null, "No edits suggested for this paragraph.")
        : el("div", { class: "heading" }, "Suggested edits"),
      ...cards,
      el("div", { class: "heading" }, "Working revision"),
      el("blockquote", { class: noChanges ? "" : "student" }, `"${preview}"`),
      showError(),
      el("div", { class: "actions" },
        i > 0 ? el("button", { class: "secondary",
          onclick: () => { state.wsIdx = i - 1; render(); }
        }, "← previous") : null,
        el("div", { class: "spacer" }),
        i < total - 1
          ? el("button", {
              onclick: async () => {
                state.wsIdx = i + 1;
                render();
                await loadWorkshopParagraph(i + 1);
              }
            }, "next paragraph →")
          : el("button", {
              onclick: () => { state.wsPhase = "done"; render(); }
            }, "finish workshop")
      )
    );
  }

  if (state.wsPhase === "done") {
    const revisedParas = state.wsParagraphs
      .map(p => applyDecisions(p.text, p.suggestions, p.decisions));
    const cleanedMd = revisedParas.join("\n\n");
    const accepted = state.wsParagraphs.reduce((n, p) =>
      n + Object.values(p.decisions).filter(d => d && d.accepted).length, 0);
    const offered = state.wsParagraphs.reduce((n, p) => n + p.suggestions.length, 0);
    const renderParas = (paras, klass) =>
      el("blockquote", { class: klass, style: "white-space: pre-wrap;" },
        paras.map((t, i) => el("p", { style: i === 0 ? "margin-top: 0;" : null }, t))
      );
    return el("div", null,
      headerBlock,
      el("p", null, `You accepted ${accepted} of ${offered} suggested edits across ${state.wsParagraphs.length} paragraph${state.wsParagraphs.length === 1 ? "" : "s"}.`),
      el("div", { class: "heading" }, "Original"),
      renderParas(state.wsParagraphs.map(p => p.text), "original"),
      el("div", { class: "heading" }, "Revised"),
      renderParas(revisedParas, "student"),
      el("div", { class: "actions" },
        el("button", { class: "secondary",
          onclick: () => { state.wsPhase = "working"; state.wsIdx = 0; render(); }
        }, "back to edits"),
        el("button", {
          onclick: () => {
            const blob = new Blob([cleanedMd + "\n"], { type: "text/markdown" });
            const url = URL.createObjectURL(blob);
            const stamp = new Date().toISOString().slice(0, 10);
            const a = document.createElement("a");
            a.href = url;
            a.download = `orwell-revised-${stamp}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        }, "download .md"),
        el("div", { class: "spacer" }),
        el("button", {
          onclick: () => {
            state.wsPhase = "intro"; state.wsRaw = "";
            state.wsParagraphs = []; state.wsIdx = 0;
            render();
          }
        }, "workshop another text")
      )
    );
  }
  return null;
}

// =======================================================================
// INTRO VIEW (hosted version)
// =======================================================================

function introView() {
  return el("div", null,
    el("div", { class: "stage-label" }, "orwell-tutor"),
    el("h2", null, "Politics and the English Language"),
    el("p", null,
      "In 1946 George Orwell wrote a short essay arguing that the decay of language is bound up with the decay of thought — that worn-out metaphors, vague jargon, and the passive voice let writers say things they don't mean and readers absorb things they wouldn't accept if put plainly. \"If thought corrupts language,\" he wrote, \"language can also corrupt thought.\""),
    el("p", null,
      "At the end of the essay he offered six rules. They are deliberately blunt — the point isn't to be a stickler, it's to make you stop and notice when your sentences have gone slack."),
    el("div", { class: "heading" }, "Orwell's six rules"),
    el("ol", { style: "padding-left: 1.4em; margin: 8px 0 16px;" },
      el("li", null, "Never use a metaphor, simile, or other figure of speech which you are used to seeing in print."),
      el("li", null, "Never use a long word where a short one will do."),
      el("li", null, "If it is possible to cut a word out, always cut it out."),
      el("li", null, "Never use the passive where you can use the active."),
      el("li", null, "Never use a foreign phrase, a scientific word, or a jargon word if you can think of an everyday English equivalent."),
      el("li", null, "Break any of these rules sooner than say anything outright barbarous.")
    ),
    el("div", { class: "heading" }, "Two ways to use this"),
    el("p", null,
      el("strong", null, "Workshop "),
      "— paste any prose you've written and walk through it paragraph by paragraph. For each paragraph you'll get concrete suggested edits drawn from the rules above; accept, edit, or skip each one, then download the revised text. This is the main attraction."),
    el("p", null,
      el("strong", null, "Tutorial "),
      "— a slower, three-stage drill: practice each rule on corrupted Orwell sentences, then identify which rule a passage breaks, then run a paragraph of your own through the full rubric. Useful if you want to internalise the rules before applying them."),
    el("div", { class: "actions" },
      el("button", {
        onclick: () => { state.view = "workshop"; render(); }
      }, "begin workshop"),
      el("button", {
        class: "secondary",
        onclick: () => {
          ensureStage1Picks();
          state.view = "stage1";
          render();
        }
      }, "run the full tutorial instead")
    )
  );
}

// =======================================================================
// MAIN RENDER
// =======================================================================

function render() {
  const root = document.getElementById("root");
  while (root.firstChild) root.removeChild(root.firstChild);
  let view;
  switch (state.view) {
    case "boot":   view = bootView();   break;
    case "setup":  view = setupView();  break;
    case "intro":  view = introView();  break;
    case "stage1": view = stage1View(); break;
    case "stage2": view = stage2View(); break;
    case "stage3": view = stage3View(); break;
    case "workshop": view = workshopView(); break;
    case "done":   view = doneView();   break;
    default:       view = setupView();  break;
  }
  if (view) {
    const tutorialViews = ["stage1", "stage2", "stage3", "done"];
    if (tutorialViews.indexOf(state.view) !== -1) {
      const back = el("a", {
        href: "#",
        style: "color: var(--comment); font-size: 11px; text-decoration: none; display: inline-block; margin-bottom: 12px;",
        onclick: (e) => {
          e.preventDefault();
          state.view = "intro";
          render();
        }
      }, "← back to main screen");
      root.appendChild(back);
    }
    root.appendChild(view);
  }
  setTitleBar();
}

if (state.apiKey && EMBEDDED_API_KEY) state.view = "workshop";
installGlobalSelectionCatcher();
render();
</script>
</body>
</html>
